{"name": "unpack-site", "on": {"push": {"paths": ["*site-part*.zip"]}, "workflow_dispatch": null}, "permissions": {"contents": "write"}, "jobs": {"unpack": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"name": "Unpack", "run": "shopt -s nullglob; parts=(*site-part*.zip); if [ ${#parts[@]} -gt 0 ]; then git rm -q --ignore-unmatch -- \":(glob)*.jpg\" || true; for z in \"${parts[@]}\"; do unzip -o -q \"$z\"; git rm -q \"$z\"; done; git config user.name github-actions; git config user.email actions@github.com; git add -A; git commit -m \"Unpack site files\" || true; git push; fi"}]}}}
